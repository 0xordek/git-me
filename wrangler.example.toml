name = "git-me"
main = "src/worker.ts"
compatibility_date = "2026-07-12"
workers_dev = true

[[r2_buckets]]
binding = "GITME_R2"
bucket_name = "git-me-objects"

[[kv_namespaces]]
binding = "GITME_KV"
# Copy this file to wrangler.local.toml and replace before deployment.
id = "00000000000000000000000000000000"

[[durable_objects.bindings]]
name = "GITME_AUTH"
class_name = "AuthUser"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AuthUser"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01
