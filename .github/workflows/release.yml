name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.32.0'
      - run: tinygo build -o build/git-me.wasm -target wasm -no-debug ./cmd/worker/
      - uses: softprops/action-gh-release@v2
        with:
          files: build/git-me.wasm
