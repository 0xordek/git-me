name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: test "v$(node -p \"require('./package.json').version\")" = "$GITHUB_REF_NAME"
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          npm view "@0xordek/git-me@$VERSION" version >/dev/null 2>&1 || npm publish --provenance --access public
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
