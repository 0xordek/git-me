name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      - run: node -e 'if (`v${require("./package.json").version}` !== process.env.GITHUB_REF_NAME) process.exit(1)'
      - name: Verify npm trusted publisher
        run: |
          OIDC_TOKEN=$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" | jq -r .value)
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/%400xordek%2Fgit-me" \
            > /dev/null
      - run: |
          VERSION=$(node -p "require('./package.json').version")
          npm view "@0xordek/git-me@$VERSION" version >/dev/null 2>&1 || npm publish --access public
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
