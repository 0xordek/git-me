name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: acifani/setup-tinygo@v2
        with:
          tinygo-version: '0.32.0'
      - run: go test -v -race -count=1 ./...
      - run: go vet ./...
      - run: npm test
      - run: make build
      - run: sha256sum build/git-me.wasm > build/git-me.wasm.sha256
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/git-me.wasm
            build/git-me.wasm.sha256
